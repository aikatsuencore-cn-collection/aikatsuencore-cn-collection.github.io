      <div class="info-modal-body">
        <form id="addCardForm" class="add-form">
          <label class="add-field">
            <span>卡面图</span>
            <input type="file" id="addImg" accept="image/*" />
            <img id="addImgPreview" class="add-img-preview" alt="预览" hidden />
          </label>
          <label class="add-field"><span>名称</span><input type="text" id="addName" placeholder="例如：樱色蝴蝶结" /></label>
          <label class="add-field"><span>类型</span>
            <select id="addType">
              <option value="cute">cute</option><option value="cool">cool</option>
              <option value="sexy">sexy</option><option value="pop">pop</option>
            </select>
          </label>
          <label class="add-field"><span>稀有</span>
            <select id="addRarity">
              <option value="normal">nomal</option><option value="rare">rare</option>
              <option value="premium rare">premium rare</option><option value="encore rare">encour rare</option>
            </select>
          </label>
          <label class="add-field"><span>类别</span>
            <select id="addCategory">
              <option value="tops">tops</option><option value="bottoms">bottoms</option>
              <option value="shoes">shoes</option><option value="tops&bottoms">tops&bottoms</option>
              <option value="full outfit">full outfit</option><option value="accessories">accessories</option>
            </select>
          </label>
          <label class="add-field"><span>品牌</span>
            <select id="addBrand">
              <option value="no brand">no brand</option><option value="Angely Sugar">Angely sugar</option>
              <option value="Futuring Girl">Futuring Girl</option><option value="Spicy Ageha">Spicy Ageha</option>
              <option value="Dreamy Crown">Dreamy Crown</option><option value="Maple Ribbon">Maple Ribbon</option>
            </select>
          </label>
          <label class="add-field"><span>显示</span>
            <select id="addParallel">
              <option value="false">常规卡</option><option value="true">平行卡</option>
            </select>
          </label>
          <label class="add-field"><span>系列</span>
            <select id="addGroup"><!-- 选项由 app.js 自动生成 --></select>
          </label>
          <div class="add-actions">
            <button type="button" class="btn" id="addCancel">取消</button>
            <button type="submit" class="btn save">添加</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 卡片计数弹窗（简洁版 / 详细版） -->
  <div class="modal-mask" id="countModal" hidden>
    <div class="count-modal" role="dialog" aria-modal="true" aria-label="卡片计数">
      <button type="button" class="count-modal-close" id="countModalClose" aria-label="关闭">&times;</button>
      <div class="count-modal-left">
        <div class="count-big-wrap">
          <img class="count-big-img" id="countBigImg" alt="" />
          <span class="count-big-badge" id="countBigBadge" hidden>0</span>
        </div>
        <div class="count-big-name" id="countBigName"></div>
      </div>
      <div class="count-modal-right" id="countRight"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden data-page-node-id="EncaFjBWJ2RksXjo14Xr4v"></div>
